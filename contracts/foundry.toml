[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 1000
verbosity = 3

# Fuzz / invariant
[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 64
depth = 64

[fmt]
line_length = 100
bracket_spacing = true
int_types = "long"
